# Include inside this application's server block, before FastCGI locations.
# Current forms send JSON/base64; reject multipart before PHP parses the body.
if ($http_content_type ~* "multipart/") {
    return 415;
}

# Only Laravel's front controller may execute, including under public/storage.
if ($uri ~ "^/(?!index[.]php$).*[.](?i:php[0-9]*|phtml|phar)(/|$)") {
    return 403;
}
