; Load through the FPM php.ini/conf.d configuration, then restart its workers.
; Laravel ini_set() and .user.ini run too late for the upload-progress startup path.
; These settings supplement a patched PHP runtime; they do not fix PHP2Shell.
; This repository file is inactive until installed in the FPM configuration.
session.upload_progress.enabled = Off
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
allow_url_include = Off
zend.exception_ignore_args = On
